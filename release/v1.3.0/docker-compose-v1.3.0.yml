version: '3.8'

services:
  lottery:
    image: techfunways/lottery:v1.3.0
    container_name: lottery-assistant
    restart: unless-stopped
    ports:
      - "8902:8902"
    volumes:
      - ./data:/app/data
    environment:
      - PORT=8902
      - DATA_DIR=/app/data
      - ENV=production
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8902"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
